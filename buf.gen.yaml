version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jacoknapp/prometheus-mcp-fleet/internal/gen
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
