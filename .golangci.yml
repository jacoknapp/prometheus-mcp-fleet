# golangci-lint v2 configuration.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # an unclosed response body leaks a connection; we proxy a lot of them
    - contextcheck # every I/O path must carry the caller's context
    - copyloopvar
    - durationcheck
    - errorlint # forces errors.Is/As over == and type assertion
    - exhaustive # a missing case in a closed enum (promapi.Endpoint) is a real bug
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - prealloc
    - revive
    - rowserrcheck
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      # check-blank stays off: `_ = f()` is the idiomatic, greppable way to say
      # "this error is deliberately ignored". Flagging it pushes people toward
      # dropping the assignment entirely, which is strictly worse.
      check-blank: false
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the injected *slog.Logger, not stdout
        - pattern: ^log\.(Print|Fatal|Panic).*$
          msg: use log/slog, not the log package
        - pattern: ^math/rand\.
          msg: use crypto/rand for anything security relevant, math/rand/v2 otherwise
        - pattern: ^http\.DefaultClient$
          msg: construct an explicit http.Client with timeouts
        - pattern: ^panic$
          msg: return an error; panic must not cross a package boundary
    gosec:
      excludes:
        # G404 is handled by the forbidigo rule above with a clearer message.
        - G404
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability of domain structs wins over a few bytes
        # shadow fires on the near-universal `if err := f(); err != nil` inside
        # a function that already has an `err`. The pattern is correct Go and
        # the check has no way to tell it from a genuine mistake.
        - shadow
    revive:
      rules:
        - name: exported # every exported symbol must be documented
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: context-keys-type
        - name: indent-error-flow
        - name: var-naming
        - name: unexported-return
        - name: errorf
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unreachable-code
    sloglint:
      no-mixed-args: true
      # The codebase uses key-value pairs consistently. Requiring slog.String()
      # everywhere would be a mechanical change to ~150 call sites that makes
      # log lines longer and no more correct.
      kv-only: false
      attr-only: false
      # `scope` requires InfoContext/WarnContext/ErrorContext/DebugContext only
      # where a context.Context is already in scope, which is exactly where the
      # log record can pick up the active span. OpenTelemetry tracing is a
      # shipped feature, so a line emitted inside a traced operation that drops
      # the trace ID is a line an operator cannot correlate back to the request
      # that produced it. Bootstrap, config-loading and shutdown paths with no
      # context in scope are untouched: there is nothing there to carry.
      context: scope
      static-msg: false
      key-naming-case: snake
    staticcheck:
      checks: ["all"]

  exclusions:
    generated: lax
    warn-unused: true
    rules:
      # The MCP tool handlers echo caller-supplied text back in errors on purpose.
      - path: ^internal/mcptools/
        linters: [perfsprint]
      # Reading a file whose path came from configuration is the entire job of
      # a configuration-driven loader. gosec cannot distinguish it from a
      # traversal, and the paths here are operator-supplied, not caller-supplied.
      - path: ^internal/(ca|token|config|promclient|kube|spoke|hub|store/filestore)/
        text: "G304"
      # Tests close bodies in defers, assert on errors they deliberately drop,
      # and construct requests without a context on purpose.
      - path: _test\.go$
        linters: [errcheck, bodyclose, contextcheck, noctx, unparam, gosec, prealloc]
      # A test asserts by aborting. panic is how a test helper reports that its
      # own fixtures are broken -- there is no caller to return an error to --
      # and a test's http.DefaultClient talks to an httptest server on
      # localhost, where the missing timeout cannot hang a production request.
      - path: _test\.go$
        linters: [forbidigo]
      # internal/testutil is a test-only package: everything in it runs under
      # `go test`, and a malformed fixture there is a broken test, not a
      # runtime condition a caller could handle.
      - path: ^internal/testutil/
        linters: [forbidigo]
      # Two registration-time invariants. mcpsurface.AddTool panics when the
      # MCP SDK cannot infer a schema for a tool's In/Out types, and
      # obs.NewRegistry panics on a metric-name fragment that does not match
      # its grammar. Both are programming errors discovered at process start
      # and in every test, never on a request, so nothing crosses a package
      # boundary at runtime; returning an error would instead defer a
      # guaranteed failure to first use.
      - path: ^internal/(mcpsurface/tool|obs/metrics)\.go$
        linters: [forbidigo]
        text: "use of `panic` forbidden"
      # The sanitiser's whole subject is bidirectional overrides and zero-width
      # characters. Escaping them turns a table of hostile inputs into a wall
      # of \u202e and makes the security control unreviewable -- the one place
      # where seeing the literal byte is the point.
      - path: ^internal/(render|mcptools)/.*_test\.go$
        linters: [staticcheck]
        text: "ST1018"
      # This test exists to prove that a redacting type survives every fmt
      # verb. Calling String() instead of formatting with %s would skip the
      # exact dispatch path the test is there to cover.
      - path: ^internal/token/redact_test\.go$
        linters: [staticcheck]
        text: "S1025"
      # G101 fires on identifiers containing "Secret" or "Token". Every hit is
      # the *name* of a Kubernetes Secret object, or a truncation-reason
      # string; no credential is in source. Checked 2026-08-30.
      - path: ^internal/(config/(hub|spoke)|render/truncate|store/secretstore/secretstore)\.go$
        linters: [gosec]
        text: "G101"
      # G705 traces request data into a response body. These handlers write
      # encoding/json output under an explicit application/json content type
      # with X-Content-Type-Options: nosniff, which is not an XSS sink; there
      # is no HTML template anywhere in this service. internal/testutil is the
      # same shape and less: FakePrometheus serves embedded JSON fixtures over
      # an httptest listener to this module's own tests, and no browser ever
      # sees it.
      - path: ^internal/(hubapi|httpx|testutil)/
        linters: [gosec]
        text: "G705"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jacoknapp/prometheus-mcp-fleet
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
