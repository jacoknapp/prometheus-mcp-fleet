{{/*
Copyright The prometheus-mcp-fleet Authors.
SPDX-License-Identifier: Apache-2.0

Every metric name below is copied from internal/obs/metrics.go, which is the
only definition of the promfleet_* series. Both *_cert_expiry_seconds gauges
hold SECONDS REMAINING (obs sets them from time.Until), not a unix timestamp,
so the comparison is a bare `< threshold` and never `- time()`.
*/}}
{{- if .Values.metrics.prometheusRule.enabled -}}
{{- include "prometheus-mcp-hub.validate" . -}}
{{- $sel := include "prometheus-mcp-hub.ruleSelector" . -}}
{{- $fullname := include "prometheus-mcp-hub.fullname" . -}}
{{- $ns := include "prometheus-mcp-hub.namespace" . -}}
{{/* int64 on every integer threshold: Helm parses a large YAML integer as a
     float64, so a bare render turns 1209600 into 1.2096e+06. PromQL accepts that,
     but nobody reading the alert at 03:00 should have to. */}}
{{- $t := .Values.metrics.prometheusRule.thresholds -}}
{{- $runbook := .Values.metrics.prometheusRule.runbookUrlPrefix -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  namespace: {{ .Values.metrics.prometheusRule.namespace | default $ns }}
  labels:
    {{- include "prometheus-mcp-hub.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $ann := merge (dict) .Values.metrics.prometheusRule.annotations .Values.commonAnnotations }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: {{ $fullname }}.rules
      rules:
        {{- if .Values.metrics.prometheusRule.rules.hubDown }}
        - alert: PrometheusMCPHubDown
          expr: absent(up{ {{ $sel }} } == 1)
          for: 5m
          labels:
            severity: critical
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: prometheus-mcp-fleet hub is not being scraped successfully
            description: >-
              No hub instance matching {{ $sel }} has reported up==1 for 5 minutes.
              Every AI agent has lost Prometheus access to the whole fleet and every
              spoke tunnel is down.
            runbook_url: {{ $runbook }}prometheusmcphubdown
        {{- end }}
        {{- if .Values.metrics.prometheusRule.rules.spokesDisconnected }}
        - alert: PrometheusMCPSpokesDisconnected
          expr: >-
            (count(promfleet_hub_spoke_connected{ {{ $sel }} } == 0)
            / count(promfleet_hub_spoke_connected{ {{ $sel }} })) > {{ $t.spokesDisconnectedRatio }}
          for: 10m
          labels:
            severity: warning
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: More than {{ mulf $t.spokesDisconnectedRatio 100 }}% of registered spokes have no tunnel
            description: >-
              {{ printf "{{ $value | humanizePercentage }}" }} of the spokes known to the
              hub have promfleet_hub_spoke_connected == 0 and have had for 10 minutes.
              Queries against those clusters fail with a spoke-unreachable tool error.
            runbook_url: {{ $runbook }}prometheusmcpspokesdisconnected
        {{- end }}
        {{- if .Values.metrics.prometheusRule.rules.caCertExpiringSoon }}
        - alert: PrometheusMCPHubCACertExpiringSoon
          expr: promfleet_hub_ca_cert_expiry_seconds{ {{ $sel }} } < {{ $t.caCertExpirySeconds | int64 }}
          for: 1h
          labels:
            severity: critical
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: prometheus-mcp-fleet internal CA certificate expires soon
            description: >-
              The hub's internal CA expires in
              {{ printf "{{ $value | humanizeDuration }}" }}. When it expires no spoke can
              enrol or renew and every existing tunnel fails to re-establish. The hub
              also reports NotReady once the CA is inside 24h of expiry.
            runbook_url: {{ $runbook }}prometheusmcphubcacertexpiringsoon
        {{- end }}
        {{- if .Values.metrics.prometheusRule.rules.caRotationStalled }}
        {{/*
          The hub rotates its own CA, so this alert is about a rotation that has
          stopped moving rather than one that is under way: a healthy rotation
          spends weeks in publishing and signing on purpose. The phase gauge is
          1 on exactly one label, and the start gauge is a UNIX TIMESTAMP, not
          seconds remaining, so this one really is `time() - ...`.
        */}}
        - alert: PrometheusMCPHubCARotationStalled
          expr: >-
            (max(promfleet_hub_ca_rotation_phase{ {{ $sel }}, phase!="steady" }) == 1)
            and on()
            ((time() - max(promfleet_hub_ca_rotation_phase_start_timestamp_seconds{ {{ $sel }} }))
            > {{ $t.caRotationStalledSeconds | int64 }})
          for: 1h
          labels:
            severity: warning
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: The hub's CA rotation has not advanced for {{ div $t.caRotationStalledSeconds 86400 }} days
            description: >-
              A CA rotation entered its current phase
              {{ printf "{{ $value | humanizeDuration }}" }} ago and has not moved on.
              Nothing is broken yet -- both the outgoing and the incoming root are
              trusted for as long as this lasts -- but the rotation is not finishing.
              The usual cause is a spoke that still holds a certificate from the
              outgoing root; check sum(promfleet_hub_ca_outgoing_root_sessions).
            runbook_url: {{ $runbook }}prometheusmcphubcarotationstalled
        {{- end }}
        {{- if .Values.metrics.prometheusRule.rules.spokeCertExpiringSoon }}
        - alert: PrometheusMCPHubSpokeCertExpiringSoon
          expr: promfleet_hub_spoke_cert_expiry_seconds{ {{ $sel }} } < {{ $t.spokeCertExpirySeconds | int64 }}
          for: 1h
          labels:
            severity: warning
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: An issued spoke certificate is close to expiry and has not been renewed
            description: >-
              The certificate issued to cluster {{ printf "{{ $labels.cluster }}" }}
              expires in {{ printf "{{ $value | humanizeDuration }}" }} and the spoke has
              not renewed it. That spoke drops off the fleet when it does.
            runbook_url: {{ $runbook }}prometheusmcphubspokecertexpiringsoon
        {{- end }}
        {{- if .Values.metrics.prometheusRule.rules.proxyErrorRatioHigh }}
        - alert: PrometheusMCPHubProxyErrorRatioHigh
          expr: >-
            (sum by (cluster) (rate(promfleet_hub_proxy_requests_total{ {{ $sel }}, code=~"5.." }[5m]))
            / sum by (cluster) (rate(promfleet_hub_proxy_requests_total{ {{ $sel }} }[5m]))) > {{ $t.proxyErrorRatio }}
          for: 10m
          labels:
            severity: warning
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: Proxied Prometheus requests are failing for cluster {{ printf "{{ $labels.cluster }}" }}
            description: >-
              {{ printf "{{ $value | humanizePercentage }}" }} of proxied requests to
              cluster {{ printf "{{ $labels.cluster }}" }} returned 5xx over the last 5
              minutes. Check that cluster's Prometheus and the spoke's logs.
            runbook_url: {{ $runbook }}prometheusmcphubproxyerrorratiohigh
        {{- end }}
        {{- if .Values.metrics.prometheusRule.rules.stateSecretLarge }}
        - alert: PrometheusMCPHubStateSecretLarge
          expr: promfleet_hub_state_bytes{ {{ $sel }} } > {{ $t.stateBytes | int64 }}
          for: 1h
          labels:
            severity: warning
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: The hub's persisted state is approaching the 700 KiB Secret write ceiling
            description: >-
              The encoded state document is {{ printf "{{ $value | humanize1024 }}" }}B.
              The hub refuses writes past 700 KiB rather than discovering the
              Kubernetes 1 MiB Secret cap during an enrollment, at which point
              minting and enrolling fail. Prune expired keys, burned enrollment
              records and lapsed certificate revocations through the admin API.
            runbook_url: {{ $runbook }}prometheusmcphubstatesecretlarge
        {{- end }}
        {{- if .Values.metrics.prometheusRule.rules.revocationStale }}
        {{/* This one legitimately compares against time(): the series is the unix
             time of the last SUCCESSFUL refresh, not a seconds-remaining gauge. */}}
        - alert: PrometheusMCPHubRevocationStale
          expr: >-
            (time() - promfleet_hub_revocation_refresh_timestamp_seconds{ {{ $sel }} })
            > {{ $t.revocationStaleSeconds | int64 }}
          for: 5m
          labels:
            severity: warning
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: A hub replica has not refreshed its revocation list
            description: >-
              No successful revoked-serial refresh for
              {{ printf "{{ $value | humanizeDuration }}" }}. The replica keeps serving
              its last good list rather than disconnecting the fleet, which means a
              certificate revoked SINCE then is still being admitted by this replica.
              Check the hub's access to its state Secret.
            runbook_url: {{ $runbook }}prometheusmcphubrevocationstale
        {{- end }}
        {{- if and .Values.metrics.prometheusRule.rules.peerDiscoveryBroken .Values.peerDiscovery.enabled (gt (int .Values.replicaCount) 1) }}
        {{/* Rendered only when discovery is on and more than one replica is
             deployed: with either off, a low count is not a defect. The
             deployed count is baked in at render time, which is exactly what
             the gauge should equal. */}}
        - alert: PrometheusMCPHubPeerDiscoveryBroken
          expr: promfleet_hub_discovered_peers{ {{ $sel }} } < {{ .Values.replicaCount | int64 }}
          for: 15m
          labels:
            severity: warning
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: Hub peer discovery resolves fewer replicas than are deployed
            description: >-
              This replica's headless-Service lookup finds
              {{ printf "{{ $value }}" }} replicas of {{ .Values.replicaCount }} deployed.
              Spokes learn the replica count from this number: while it is low they
              hold too few tunnels, a share of tool calls fail with "cluster not
              connected", and the spokes' own partial-coverage alert cannot fire
              because they never learn a count to fall short of. Check DNS egress
              from the hub pods and that the headless Service exists and selects
              every hub pod.
            runbook_url: {{ $runbook }}prometheusmcphubpeerdiscoverybroken
        {{- end }}
        {{- if .Values.metrics.prometheusRule.rules.restartLoop }}
        {{/* Requires kube-state-metrics. The hub is a Deployment, so its pods are
             <fullname>-<replicaset hash>-<pod suffix>, never the ordinal suffix a
             StatefulSet would give. Set rules.restartLoop=false without KSM. */}}
        - alert: PrometheusMCPHubRestartLoop
          expr: >-
            increase(kube_pod_container_status_restarts_total{namespace="{{ $ns }}",
            pod=~"{{ $fullname }}-[a-z0-9]+-[a-z0-9]+",container="hub"}[1h]) > {{ $t.restartsPerHour | int64 }}
          for: 5m
          labels:
            severity: warning
            {{- with .Values.metrics.prometheusRule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: prometheus-mcp-fleet hub is restarting repeatedly
            description: >-
              {{ printf "{{ $labels.pod }}" }} has restarted
              {{ printf "{{ $value }}" }} times in the last hour. Every restart drops
              every spoke tunnel and every in-flight agent request.
            runbook_url: {{ $runbook }}prometheusmcphubrestartloop
        {{- end }}
    {{- with .Values.metrics.prometheusRule.additionalGroups }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
