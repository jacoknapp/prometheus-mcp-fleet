{{/*
Copyright The prometheus-mcp-fleet Authors.
SPDX-License-Identifier: Apache-2.0

Standard networking.k8s.io/v1 Ingress for the MCP listener, which carries BOTH
the agent-facing MCP endpoint and the spoke tunnel WebSocket at tunnel.path
(ADR-0014). There is no Gateway API HTTPRoute and no OpenShift Route here, and
there is no longer a tunnel Service: the tunnel is ordinary HTTP.

The tunnel entry is rendered EXPLICITLY whenever the host's own path would not
already route it. An Ingress that misses tunnel.path yields a hub that passes
every probe, serves MCP correctly and accepts zero spokes -- the most expensive
kind of healthy.

Idle timeouts are the one operational hazard: a controller closes idle upgraded
connections. The tunnel's HTTP/2 keepalive pings run every 10s, well inside
nginx's 60s default, but see ingress.annotations in values.yaml for the knob to
raise on a stricter controller.
*/}}
{{- if .Values.ingress.enabled -}}
{{- include "prometheus-mcp-hub.validate" . -}}
{{- $fullName := include "prometheus-mcp-hub.fullname" . -}}
{{- $port := .Values.service.mcpPort -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ include "prometheus-mcp-hub.namespace" . }}
  labels:
    {{- include "prometheus-mcp-hub.labels" . | nindent 4 }}
  {{- $ann := merge (dict) .Values.ingress.annotations .Values.commonAnnotations }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- if .Values.ingress.tls.hosts }}
        {{- toYaml .Values.ingress.tls.hosts | nindent 8 }}
        {{- else }}
        {{- include "prometheus-mcp-hub.ingressHosts" . | nindent 8 }}
        {{- end }}
      {{- /* cert-manager's Certificate Secret wins when certManager.enabled, so the two cannot drift apart. */}}
      {{- with (include "prometheus-mcp-hub.ingressTLSSecretName" .) }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
          {{- if not (include "prometheus-mcp-hub.pathCoversTunnel" (list . .Values.ingress.path .Values.ingress.pathType)) }}
          # ingress.path does not cover tunnel.path, so the spoke tunnel gets
          # its own rule. Without this no spoke can ever connect.
          - path: {{ .Values.tunnel.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
          {{- end }}
    {{- range .Values.ingress.extraHosts }}
    {{- $path := .path | default "/" }}
    {{- $pathType := .pathType | default "Prefix" }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ $path }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
          {{- if not (include "prometheus-mcp-hub.pathCoversTunnel" (list $ $path $pathType)) }}
          - path: {{ $.Values.tunnel.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
          {{- end }}
    {{- end }}
{{- end }}
