{{- if .Values.networkPolicy.enabled -}}
{{- include "prometheus-mcp-hub.validate" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "prometheus-mcp-hub.fullname" . }}
  namespace: {{ include "prometheus-mcp-hub.namespace" . }}
  labels:
    {{- include "prometheus-mcp-hub.labels" . | nindent 4 }}
    {{- with .Values.networkPolicy.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "prometheus-mcp-hub.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "prometheus-mcp-hub.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    # MCP: agents reach this through the Ingress controller -- and so do SPOKE
    # TUNNELS. Since ADR-0014 the tunnel is a WebSocket on this same port, so
    # this one rule is the whole inbound story and there is no tunnel port to
    # open. If you narrow it, narrow it to the Ingress controller, never to the
    # agents alone, or every spoke in the fleet is cut off.
    {{- $sources := deepCopy .Values.networkPolicy.mcp }}
    {{- $_ := set $sources "extraFrom" (append ($sources.extraFrom | default list) (fromYaml (include "prometheus-mcp-hub.testPeer" .))) }}
    {{- $peers := include "prometheus-mcp-hub.networkPeers" $sources }}
    {{- if or $peers .Values.networkPolicy.mcp.allowAll }}
    - ports:
        - port: mcp
          protocol: TCP
      {{- if not .Values.networkPolicy.mcp.allowAll }}
      from:
        {{- $peers | nindent 8 }}
      {{- end }}
    {{- end }}
    # Admin/metrics: scrapers and this release's Helm test pod.
    {{- $sources := deepCopy .Values.networkPolicy.admin }}
    {{- $_ := set $sources "extraFrom" (append ($sources.extraFrom | default list) (fromYaml (include "prometheus-mcp-hub.testPeer" .))) }}
    {{- $peers := include "prometheus-mcp-hub.networkPeers" $sources }}
    {{- if $peers }}
    - ports:
        - port: admin
          protocol: TCP
      from:
        {{- $peers | nindent 8 }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowKubeAPI }}
    # The hub reads and writes its state Secret through the API server. Without
    # this rule it cannot start with state.backend=secret. Every port in the
    # list is allowed, because the Service port (443) and the endpoint port
    # the CNI actually sees after DNAT (often 6443) are not the same number.
    {{- /* Normalised to int first: Helm hands YAML numbers over as float64 and `has` would never match. */}}
    {{- $ports := list }}
    {{- range .Values.networkPolicy.egress.kubeAPIPorts }}
    {{- $ports = append $ports (int .) }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.kubeAPIPort }}
    {{- if not (has (int .) $ports) }}
    {{- $ports = append $ports (int .) }}
    {{- end }}
    {{- end }}
    {{- if not $ports }}
    {{- fail "prometheus-mcp-hub: networkPolicy.egress.allowKubeAPI is true but networkPolicy.egress.kubeAPIPorts is empty; the rule would allow nothing and the hub could not reach its state Secret." }}
    {{- end }}
    - ports:
        {{- range $ports }}
        - port: {{ int . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
