{{/*
Copyright The prometheus-mcp-fleet Authors.
SPDX-License-Identifier: Apache-2.0

The tunnel listener is mutually authenticated TLS and the hub must see the
spoke's client certificate. An HTTP Ingress terminates TLS and cannot pass one
through, so the tunnel gets its own Service -- LoadBalancer by default, because
the spokes are in other clusters. An ssl-passthrough Ingress works too but is
controller-specific; see the README.

This Service carries the tunnel port and nothing else. It never carries admin.
*/}}
{{- if .Values.tunnel.service.enabled -}}
{{- include "prometheus-mcp-hub.validate" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus-mcp-hub.tunnelServiceName" . }}
  namespace: {{ include "prometheus-mcp-hub.namespace" . }}
  labels:
    {{- include "prometheus-mcp-hub.componentLabels" (list . "hub-tunnel") | nindent 4 }}
    {{- with .Values.tunnel.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $ann := merge (dict) .Values.tunnel.service.annotations .Values.commonAnnotations }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.tunnel.service.type }}
  {{- if eq .Values.tunnel.service.type "LoadBalancer" }}
  {{- with .Values.tunnel.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.tunnel.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.tunnel.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if and .Values.tunnel.service.externalTrafficPolicy (ne .Values.tunnel.service.type "ClusterIP") }}
  externalTrafficPolicy: {{ .Values.tunnel.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "prometheus-mcp-hub.selectorLabels" . | nindent 4 }}
  ports:
    - name: tunnel
      port: {{ .Values.tunnel.service.port }}
      targetPort: tunnel
      protocol: TCP
      {{- if and (eq .Values.tunnel.service.type "NodePort") .Values.tunnel.service.nodePort }}
      nodePort: {{ .Values.tunnel.service.nodePort }}
      {{- end }}
{{- end }}
