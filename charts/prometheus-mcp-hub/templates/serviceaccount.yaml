{{- if .Values.serviceAccount.create -}}
{{- include "prometheus-mcp-hub.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prometheus-mcp-hub.serviceAccountName" . }}
  namespace: {{ include "prometheus-mcp-hub.namespace" . }}
  labels:
    {{- include "prometheus-mcp-hub.labels" . | nindent 4 }}
  {{- $ann := merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
true, not false: the hub reads and writes its own state Secret through the
Kubernetes API and therefore needs the projected token. That is the whole
reason there is no PVC.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
