{{/*
Copyright The prometheus-mcp-fleet Authors.
SPDX-License-Identifier: Apache-2.0

MCP and admin. ClusterIP only: `prometheus-mcp-hub.validate` refuses to render
a LoadBalancer or NodePort here while the admin port is published, because that
port carries the admin REST API and pprof.
*/}}
{{- include "prometheus-mcp-hub.validate" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus-mcp-hub.fullname" . }}
  namespace: {{ include "prometheus-mcp-hub.namespace" . }}
  labels:
    {{- include "prometheus-mcp-hub.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $ann := merge (dict) .Values.service.annotations .Values.commonAnnotations }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- with .Values.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector:
    {{- include "prometheus-mcp-hub.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.mcpPort }}
      targetPort: mcp
      protocol: TCP
    {{- if .Values.service.admin.enabled }}
    - name: admin
      port: {{ .Values.service.admin.port }}
      targetPort: admin
      protocol: TCP
    {{- end }}
