{{- if .Values.metrics.serviceMonitor.enabled -}}
{{- include "prometheus-mcp-hub.validate" . -}}
{{- if not .Values.service.admin.enabled -}}
{{- fail "prometheus-mcp-hub: metrics.serviceMonitor.enabled requires service.admin.enabled, otherwise there is no Service port to scrape." -}}
{{- end -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "prometheus-mcp-hub.fullname" . }}
  namespace: {{ .Values.metrics.serviceMonitor.namespace | default (include "prometheus-mcp-hub.namespace" .) }}
  labels:
    {{- include "prometheus-mcp-hub.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $ann := merge (dict) .Values.metrics.serviceMonitor.annotations .Values.commonAnnotations }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - {{ include "prometheus-mcp-hub.namespace" . }}
  selector:
    matchLabels:
      {{- include "prometheus-mcp-hub.selectorLabels" . | nindent 6 }}
  {{- with .Values.metrics.serviceMonitor.targetLabels }}
  targetLabels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  endpoints:
    - port: admin
      path: {{ .Values.metrics.serviceMonitor.path }}
      scheme: http
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      honorLabels: {{ .Values.metrics.serviceMonitor.honorLabels }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
