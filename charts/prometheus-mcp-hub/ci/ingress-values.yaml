#
# MCP published through a standard networking.k8s.io/v1 Ingress, with the tunnel
# on its own LoadBalancer because an HTTP Ingress cannot pass a client
# certificate through. This is the intended production shape.
ingress:
  enabled: true
  className: nginx
  host: mcp.example.com
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  extraHosts:
    - host: mcp-alt.example.com
      path: /
      pathType: Prefix
  tls:
    enabled: true
    secretName: mcp-example-com-tls
config:
  publicURL: https://mcp.example.com
tunnel:
  serverNames:
    - tunnel.example.com
  service:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
    loadBalancerSourceRanges:
      - 203.0.113.0/24
    externalTrafficPolicy: Local
