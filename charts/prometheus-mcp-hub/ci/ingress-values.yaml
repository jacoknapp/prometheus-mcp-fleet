#
# The intended production shape: ONE standard networking.k8s.io/v1 Ingress
# carrying both the agent-facing MCP endpoint and the spoke tunnel WebSocket at
# tunnel.path. No LoadBalancer, no NodePort, no ssl-passthrough (ADR-0014).
#
# proxy-read-timeout is set well above the tunnel's 10s keepalive interval: an
# Ingress controller that closes idle upgraded connections drops every spoke.
ingress:
  enabled: true
  className: nginx
  host: mcp.example.com
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  extraHosts:
    # A deliberately NARROW path: it does not cover tunnel.path, so the chart
    # renders a second path entry for /tunnel on this host. Without that the
    # hub would serve MCP here and accept no spokes.
    - host: mcp-alt.example.com
      path: /mcp
      pathType: Prefix
  tls:
    enabled: true
    secretName: mcp-example-com-tls
config:
  publicURL: https://mcp.example.com
tunnel:
  path: /tunnel
