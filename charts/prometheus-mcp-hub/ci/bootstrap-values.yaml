#
# Adopting operator-supplied CA material and an HMAC pepper from a Secret the
# chart does NOT create, so no key material ever passes through Helm values.
bootstrap:
  existingSecret: hub-bootstrap
  pepperKey: pepper.key
  caCertKey: ca.crt
  caKeyKey: ca.key
state:
  secretName: fleet-state
  caSecretName: fleet-ca
rbac:
  allowCreate: false
  extraSecretNames:
    - fleet-state-legacy
extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: '{{ include "prometheus-mcp-hub.fullname" . }}-extra'
    data:
      note: rendered through tpl
config:
  # PMF_PUBLIC_URL is required by the binary and the chart refuses to render
  # without one (or an Ingress host to derive it from).
  publicURL: https://mcp.example.com/mcp
