#
# Two replicas, which is the only configuration in which a PodDisruptionBudget
# is rendered at all. Read the replicaCount comment in values.yaml first: a
# tunnel is pinned to one replica, so real HA also needs every replica
# individually routable -- one hostname or path prefix per replica on the same
# Ingress -- and every spoke listing all of them in hub.endpoints.
replicaCount: 2
podDisruptionBudget:
  enabled: true
  # Keeps the minAvailable branch of the template covered now that the chart
  # default is maxUnavailable: 50%. The two are mutually exclusive and the
  # chart refuses both, so this must clear the default explicitly.
  minAvailable: 1
  maxUnavailable: ""
  unhealthyPodEvictionPolicy: AlwaysAllow
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus-mcp-hub
ingress:
  enabled: true
  className: nginx
  host: hub-0.example.com
  extraHosts:
    - host: hub-1.example.com
config:
  publicURL: https://hub-0.example.com/mcp
