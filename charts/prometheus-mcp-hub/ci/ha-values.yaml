#
# Two replicas, which is the only configuration in which a PodDisruptionBudget
# is rendered at all. Read the replicaCount comment in values.yaml first: a
# tunnel is pinned to one replica, so real HA also needs every replica
# individually addressable and every spoke listing all of them.
replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus-mcp-hub
tunnel:
  serverNames:
    - hub-0.example.com
    - hub-1.example.com
