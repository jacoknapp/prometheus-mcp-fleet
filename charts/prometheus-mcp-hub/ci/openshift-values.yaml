#
# OpenShift: the restricted-v2 SCC assigns a UID from the namespace's range and
# rejects a pod that pins one. runAsNonRoot, seccompProfile and the container
# hardening all stay; only the numeric IDs go.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: null
  runAsGroup: null
  fsGroup: null
  seccompProfile:
    type: RuntimeDefault
