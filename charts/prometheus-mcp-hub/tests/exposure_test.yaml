#
# The admin listener carries the credential-issuing REST API, /metrics and
# pprof. It must never leave the cluster. These are the assertions that keep it
# that way.
suite: the admin port never leaves the cluster
# PMF_PUBLIC_URL is required; the chart refuses to render without it.
set:
  config.publicURL: https://mcp.example.com/mcp
tests:
  - it: routes only the mcp Service port through the Ingress
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080
      - notEqual:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9090

  - it: keeps the admin port out of the Ingress on every host including extraHosts
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
        extraHosts:
          - host: alt.example.com
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.port.number
          value: 8080

  - it: still routes the mcp port when the admin port is moved onto the mcp default
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
      service:
        mcpPort: 8080
      ports:
        admin: 19090
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080

  - it: refuses to route anything but the mcp port through an Ingress
    set:
      ingress:
        enabled: true
        host: mcp.example.com
        servicePortName: admin
    asserts:
      - failedTemplate:
          errorPattern: "Only the \"mcp\" port may be published through an Ingress"

  - it: refuses a LoadBalancer Service while the admin port is on it
    set:
      service:
        type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "must never be reachable from outside the cluster"

  - it: refuses a NodePort Service while the admin port is on it
    set:
      service:
        type: NodePort
    asserts:
      - failedTemplate:
          errorPattern: "must never be reachable from outside the cluster"

  - it: allows a LoadBalancer only once the admin port is off the Service
    template: templates/service.yaml
    set:
      service:
        type: LoadBalancer
        admin:
          enabled: false
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0].name
          value: mcp

  # ADR-0014: the tunnel is a WebSocket on the mcp port. There is no tunnel
  # Service, no tunnel container port and nothing on 8443 anywhere.
  - it: publishes no tunnel port on the Service
    template: templates/service.yaml
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 2
      - equal:
          path: spec.ports[0].name
          value: mcp
      - notContains:
          path: spec.ports
          content:
            name: tunnel
            port: 8443
            targetPort: tunnel
            protocol: TCP

  - it: declares no tunnel container port on the Deployment
    template: templates/deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: mcp
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: admin

  # The Ingress is the ONLY way in, so it must carry the tunnel path. A hub
  # whose Ingress misses /tunnel passes every probe and accepts zero spokes.
  - it: routes the tunnel path when ingress.path already covers it
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
        path: /
        pathType: Prefix
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 1
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /

  - it: renders every public route when ingress.path is /mcp
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
        path: /mcp
        pathType: Prefix
        extraHosts:
          - host: alt.example.com
            path: /mcp
            pathType: Prefix
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 6
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /tunnel
      - equal:
          path: spec.rules[0].http.paths[1].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.port.number
          value: 8080
      - lengthEqual:
          path: spec.rules[1].http.paths
          count: 6
      - equal:
          path: spec.rules[1].http.paths[1].path
          value: /tunnel

      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /enroll
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /renew
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /pki
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /.well-known/oauth-protected-resource/mcp
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080
      - contains:
          path: spec.rules[1].http.paths
          content:
            path: /enroll
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080
      - contains:
          path: spec.rules[1].http.paths
          content:
            path: /renew
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080
      - contains:
          path: spec.rules[1].http.paths
          content:
            path: /pki
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080
      - contains:
          path: spec.rules[1].http.paths
          content:
            path: /.well-known/oauth-protected-resource/mcp
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080

  - it: honours a custom tunnel.path in the Ingress rule it renders
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
        path: /mcp
        pathType: Prefix
      tunnel:
        path: /pmf-tunnel
    asserts:
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /pmf-tunnel

  - it: does not double up when ingress.path is exactly the tunnel path
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
        path: /tunnel
        pathType: Exact
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 6

  - it: keeps the admin port on a ClusterIP Service so a ServiceMonitor can reach it
    template: templates/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[1].name
          value: admin

  - it: preserves child routes when ingress.path is Exact /renew
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
        path: /renew
        pathType: Exact
    asserts:
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /renew
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080

  - it: preserves child routes when ingress.path is Exact /pki
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
        path: /pki
        pathType: Exact
    asserts:
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /pki
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080

  - it: preserves child routes when ingress.path is Exact /mcp
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        host: mcp.example.com
        path: /mcp
        pathType: Exact
    asserts:
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /mcp
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-prometheus-mcp-hub
                port:
                  number: 8080
