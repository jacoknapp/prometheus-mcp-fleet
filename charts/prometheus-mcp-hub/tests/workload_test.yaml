suite: hub workload shape, probes, resources and PMF_ environment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/service.yaml
  - templates/serviceaccount.yaml
  - templates/rbac.yaml
  - templates/networkpolicy.yaml
# PMF_PUBLIC_URL is required; the chart refuses to render without it.
set:
  config.publicURL: https://mcp.example.com/mcp
tests:
  - it: renders no StatefulSet and no PersistentVolumeClaim anywhere
    asserts:
      - notEqual:
          path: kind
          value: StatefulSet
      - notEqual:
          path: kind
          value: PersistentVolumeClaim

  - it: is a Deployment with no volumeClaimTemplates
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.volumeClaimTemplates
      - notExists:
          path: spec.serviceName

  - it: has no volume backed by a PersistentVolumeClaim
    template: templates/deployment.yaml
    set:
      extraVolumes:
        - name: extra
          emptyDir: {}
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            persistentVolumeClaim:
              claimName: anything
            name: data

  - it: probes /healthz for startup and liveness and /readyz for readiness, all on admin
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: admin
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: admin
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: admin

  - it: requests 250m/256Mi, limits memory to 1Gi and sets NO cpu limit
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu

  # 1Gi * 0.9 = 966367641 bytes. A literal, not a downward-API
  # resourceFieldRef: a divisor can only divide, and Kubernetes accepts only 1
  # and the unit quantities, so the ratio cannot be expressed as one. The
  # rejected form rendered and validated offline and failed only on a real API
  # server, so assert the exact number here rather than the shape.
  - it: computes GOMEMLIMIT as a literal byte count from the memory limit
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: "966367641"

  - it: rescales GOMEMLIMIT with the limit and the ratio
    template: templates/deployment.yaml
    set:
      resources:
        limits:
          memory: 512Mi
      goRuntime:
        memLimitRatio: 0.5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: "268435456"

  - it: refuses a memory limit it cannot parse rather than rendering a wrong one
    template: templates/deployment.yaml
    set:
      resources:
        limits:
          memory: 1Gib
    asserts:
      - failedTemplate:
          errorMessage: 'prometheus-mcp-hub: memory quantity "1Gib" has an unsupported suffix "Gib". Use bytes or one of k, M, G, T, P, E, Ki, Mi, Gi, Ti, Pi, Ei.'

  - it: takes PMF_NAMESPACE from the downward API, never from a rendered guess
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PMF_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: drops GOMEMLIMIT when no memory limit is set, because the downward API would report node allocatable
    template: templates/deployment.yaml
    set:
      # null, not an object without `limits`: helm-unittest deep-merges `set`
      # over the chart defaults, so a partial resources block would leave the
      # default memory limit in place and prove nothing.
      resources:
        limits: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: GOMEMLIMIT

  - it: emits every PMF_ key from internal/config/hub.go and no invented one
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: "data.PMF_MCP_ADDR"
          value: ":8080"
      - equal:
          path: "data.PMF_TUNNEL_PATH"
          value: "/tunnel"
      # ADR-0014 deleted these from internal/config/hub.go. The binary IGNORES
      # an unknown PMF_ key silently, so emitting one hands the operator a
      # default they did not ask for.
      - notExists:
          path: "data.PMF_TUNNEL_ADDR"
      - notExists:
          path: "data.PMF_TUNNEL_SERVER_NAMES"
      - notExists:
          path: "data.PMF_TUNNEL_TLS_CERT_FILE"
      - notExists:
          path: "data.PMF_TUNNEL_TLS_KEY_FILE"
      - equal:
          path: "data.PMF_ADMIN_ADDR"
          value: ":9090"
      - equal:
          path: "data.PMF_STATE_BACKEND"
          value: "secret"
      - equal:
          path: "data.PMF_STATE_SECRET_NAME"
          value: "RELEASE-NAME-prometheus-mcp-hub-state"
      - equal:
          path: "data.PMF_CA_SECRET_NAME"
          value: "RELEASE-NAME-prometheus-mcp-hub-ca"
      - equal:
          path: "data.PMF_DATA_DIR"
          value: "/tmp/prometheus-mcp-fleet"
      - equal:
          path: "data.PMF_TRUST_DOMAIN"
          value: "fleet.local"
      - notExists:
          path: "data.PMF_STATE_FILE"

  - it: renders byte counts as integers, not as Go float notation the loader would reject
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: "data.PMF_MAX_RESPONSE_BYTES"
          value: "33554432"
      - equal:
          path: "data.PMF_MAX_RESPONSE_BUDGET_BYTES"
          value: "268435456"

  - it: swaps to the file backend cleanly
    template: templates/configmap.yaml
    set:
      state:
        backend: file
        file: /tmp/prometheus-mcp-fleet/state.json
    asserts:
      - equal:
          path: "data.PMF_STATE_BACKEND"
          value: "file"
      - equal:
          path: "data.PMF_STATE_FILE"
          value: "/tmp/prometheus-mcp-fleet/state.json"
      - notExists:
          path: "data.PMF_STATE_SECRET_NAME"

  - it: pins the image by digest when one is given, ignoring the tag
    template: templates/deployment.yaml
    set:
      image:
        tag: v9.9.9
        digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jacoknapp/prometheus-mcp-fleet/hub@sha256:1111111111111111111111111111111111111111111111111111111111111111

  - it: falls back to the chart appVersion when no tag and no digest are given
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jacoknapp/prometheus-mcp-fleet/hub:0.10.2
