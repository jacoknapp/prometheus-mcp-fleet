{{/*
Copyright The prometheus-mcp-fleet Authors.
SPDX-License-Identifier: Apache-2.0

Rendered only when enrollment.token is set inline. That is convenient for a
first install and worse than enrollment.existingSecret, because a value passed
to Helm ends up in the release Secret and in `helm get values`. The token buys
exactly one spoke certificate and the hub burns it atomically on redemption, so
the exposure window is short -- but it is not zero.
*/}}
{{- if and .Values.enrollment.token (not .Values.enrollment.existingSecret) -}}
{{- include "prometheus-mcp-spoke.validate" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prometheus-mcp-spoke.enrollmentSecretName" . }}
  namespace: {{ include "prometheus-mcp-spoke.namespace" . }}
  labels:
    {{- include "prometheus-mcp-spoke.labels" . | nindent 4 }}
  {{- with (include "prometheus-mcp-spoke.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.enrollment.secretKey }}: {{ .Values.enrollment.token | quote }}
{{- end }}
