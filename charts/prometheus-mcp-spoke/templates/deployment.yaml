{{/*
Copyright The prometheus-mcp-fleet Authors.
SPDX-License-Identifier: Apache-2.0

A plain Deployment. There is no StatefulSet and no volumeClaimTemplate because
there is no durable on-disk state: the issued client key and certificate live in
the identity Secret (see templates/rbac.yaml). The only writable path in the
container is an emptyDir at /tmp.
*/}}
{{- include "prometheus-mcp-spoke.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus-mcp-spoke.fullname" . }}
  namespace: {{ include "prometheus-mcp-spoke.namespace" . }}
  labels:
    {{- include "prometheus-mcp-spoke.labels" . | nindent 4 }}
  {{- with (include "prometheus-mcp-spoke.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    # RollingUpdate. This used to be Recreate, because two pods sharing one
    # cluster ID fought: each new tunnel deregistered the other's at the hub,
    # and both renewed over the same identity Secret. Neither is true now. The
    # hub keeps a POOL of sessions per cluster keyed by a per-pod InstanceID, so
    # siblings coexist; and a pod that finds a sibling has already renewed
    # adopts that certificate instead of minting a competing one.
    #
    # So an upgrade no longer needs a gap where the cluster is missing from the
    # fleet: the old pod keeps serving until the new one has enrolled and
    # connected. Recreate would waste the availability the pool exists to give.
    type: RollingUpdate
    rollingUpdate:
      # Never drop below full strength during an upgrade, and add at most one
      # pod at a time so a hundred clusters upgrading together do not each add
      # three tunnels to the hub at once.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "prometheus-mcp-spoke.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prometheus-mcp-spoke.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.restartOnConfigChange }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "prometheus-mcp-spoke.serviceAccountName" . }}
      # Projected only for identity.backend=secret. In memory and file mode the
      # spoke never calls the Kubernetes API and gets no token at all.
      automountServiceAccountToken: {{ include "prometheus-mcp-spoke.automountToken" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spoke
          image: {{ include "prometheus-mcp-spoke.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            # The admin listener is the ONLY port. The tunnel is outbound: the
            # spoke dials the hub, so nothing ever connects in.
            - name: admin
              containerPort: {{ .Values.ports.admin }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "prometheus-mcp-spoke.configMapName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # The spoke addresses its own identity Secret in its own namespace.
            # The downward API is the only source of truth for that name.
            - name: PMF_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if and .Values.goRuntime.memLimit (dig "limits" "memory" "" .Values.resources) }}
            # GOMEMLIMIT as a literal byte count, computed from the declared
            # limit. Not a downward-API resourceFieldRef: its divisor cannot
            # express a ratio and Kubernetes rejects anything but 1 and the
            # unit quantities. See the helper for the whole story.
            - name: GOMEMLIMIT
              value: {{ include "prometheus-mcp-spoke.goMemLimit" . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
              scheme: HTTP
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          # /healthz never checks a dependency. A liveness probe that checked the
          # hub or Prometheus would restart this pod every time an upstream
          # blinked -- and in identity.backend=memory each restart burns another
          # enrollment.
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
              scheme: HTTP
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
              scheme: HTTP
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if include "prometheus-mcp-spoke.hasEnrollment" . }}
            - name: enrollment
              mountPath: {{ .Values.enrollment.mountPath }}
              readOnly: true
            {{- end }}
            {{- if or .Values.hub.caBundle .Values.hub.existingCASecret }}
            - name: hub-ca
              mountPath: {{ .Values.hub.caMountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.prometheus.bearerToken.existingSecret }}
            - name: prometheus-auth
              mountPath: {{ .Values.prometheus.bearerToken.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.prometheus.tls.existingSecret }}
            - name: prometheus-ca
              mountPath: {{ .Values.prometheus.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # readOnlyRootFilesystem: true needs exactly one writable path. With the
        # identity Secret holding the only thing worth keeping, /tmp is all
        # there is.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpDirSizeLimit }}
        {{- if include "prometheus-mcp-spoke.hasEnrollment" . }}
        - name: enrollment
          secret:
            secretName: {{ include "prometheus-mcp-spoke.enrollmentSecretName" . }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.hub.caBundle }}
        - name: hub-ca
          configMap:
            name: {{ include "prometheus-mcp-spoke.hubCAConfigMapName" . }}
            defaultMode: 0444
        {{- else if .Values.hub.existingCASecret }}
        - name: hub-ca
          secret:
            secretName: {{ .Values.hub.existingCASecret }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.prometheus.bearerToken.existingSecret }}
        - name: prometheus-auth
          secret:
            secretName: {{ .Values.prometheus.bearerToken.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.prometheus.tls.existingSecret }}
        - name: prometheus-ca
          secret:
            secretName: {{ .Values.prometheus.tls.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
