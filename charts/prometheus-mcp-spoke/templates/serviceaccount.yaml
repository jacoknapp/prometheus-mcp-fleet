{{- if .Values.serviceAccount.create -}}
{{- include "prometheus-mcp-spoke.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prometheus-mcp-spoke.serviceAccountName" . }}
  namespace: {{ include "prometheus-mcp-spoke.namespace" . }}
  labels:
    {{- include "prometheus-mcp-spoke.labels" . | nindent 4 }}
  {{- $ann := merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
true only for identity.backend=secret, where the spoke writes its issued key and
certificate through the Kubernetes API. In memory and file mode the spoke never
touches the API and the token is not projected at all.
*/}}
automountServiceAccountToken: {{ include "prometheus-mcp-spoke.automountToken" . }}
{{- end }}
