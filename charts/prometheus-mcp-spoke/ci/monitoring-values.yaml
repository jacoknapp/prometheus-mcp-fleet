# Prometheus Operator objects. Needs the monitoring.coreos.com/v1 CRDs to
# install, but renders and lints without them.
cluster:
  id: prod-eu-west-1
  sdlc: prod
hub:
  endpoints:
    - wss://hub.example.com/tunnel
    - wss://hub-2.example.com/tunnel
  apiUrl: https://hub.example.com
enrollment:
  existingSecret: spoke-enrollment
metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 15s
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
    additionalRuleLabels:
      team: platform
    thresholds:
      reconnectsPerHour: 6
tracing:
  enabled: true
  endpoint: otel-collector.observability.svc:4317
