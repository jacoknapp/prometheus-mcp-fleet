#
# The hub is in another cluster, so its egress rule is an ipBlock and a port
# taken from the hub.endpoints URLs. A namespaceSelector could never match it.
#
# Since ADR-0014 those URLs are wss:// through the hub's ordinary Ingress, so the
# default port is 443. An 8443 anywhere in here would mean the chart had gone
# back to assuming a dedicated tunnel listener that no longer exists.
suite: spoke NetworkPolicy egress reaches the configured hub
templates:
  - templates/networkpolicy.yaml
set:
  cluster:
    id: prod-us-east-1
    sdlc: prod
  hub:
    endpoints:
      - wss://hub.example.com/tunnel
    apiUrl: https://hub.example.com

tests:
  # A wss:// URL with no explicit port is ordinary HTTPS. This is the whole
  # point of ADR-0014 as far as this policy is concerned.
  - it: opens 443 for a wss hub URL with no explicit port
    asserts:
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: "0.0.0.0/0"
            ports:
              - port: 443
                protocol: TCP

  - it: opens 80 for a plaintext ws hub URL
    set:
      hub:
        endpoints:
          - ws://hub.example.com/tunnel
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: "0.0.0.0/0"
            ports:
              - port: 80
                protocol: TCP

  - it: follows an explicit port in the hub URL
    set:
      hub:
        endpoints:
          - wss://hub.example.com:9443/tunnel
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: "0.0.0.0/0"
            ports:
              - port: 9443
                protocol: TCP

  - it: pins an IP-literal hub endpoint to an exact /32
    set:
      hub:
        endpoints:
          - wss://198.51.100.10/tunnel
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: "198.51.100.10/32"
            ports:
              - port: 443
                protocol: TCP

  - it: pins a bracketed IPv6 hub endpoint to an exact /128
    set:
      hub:
        endpoints:
          - wss://[2001:db8::1]:9443/tunnel
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: "2001:db8::1/128"
            ports:
              - port: 9443
                protocol: TCP

  - it: opens every port when several hub replicas are listed
    set:
      hub:
        endpoints:
          - wss://hub-0.example.com/tunnel
          - wss://hub-1.example.com:9443/tunnel
      networkPolicy:
        egress:
          hub:
            cidrs:
              - 203.0.113.0/24
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: "203.0.113.0/24"
            ports:
              - port: 443
                protocol: TCP
              - port: 9443
                protocol: TCP

  - it: lets networkPolicy.egress.hub.ports override the derived ports
    set:
      networkPolicy:
        egress:
          hub:
            ports:
              - 8443
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: "0.0.0.0/0"
            ports:
              - port: 8443
                protocol: TCP

  - it: allows DNS, the local Prometheus and the Kubernetes API
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
            ports:
              - port: 9090
                protocol: TCP
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP

  - it: parses the Prometheus port out of the URL, including the https default
    set:
      prometheus:
        url: https://thanos-query.observability.svc
      networkPolicy:
        egress:
          prometheus:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: observability
            ports:
              - port: 443
                protocol: TCP

  - it: never selects the hub by namespace, because the hub is not in this cluster
    asserts:
      - exists:
          path: spec.egress[1].to[0].ipBlock.cidr
      - notExists:
          path: spec.egress[1].to[0].namespaceSelector
      - notExists:
          path: spec.egress[1].to[0].podSelector

  - it: accepts only the metrics port inbound
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - equal:
          path: spec.ingress[0].ports[0].port
          value: admin
