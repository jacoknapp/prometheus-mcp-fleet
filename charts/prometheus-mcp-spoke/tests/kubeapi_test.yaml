#
# The spoke writes its identity Secret through the API server. The pod dials
# the Service port (443) but most CNIs evaluate egress after kube-proxy's DNAT,
# so the port they see is the endpoint's (usually 6443). Allowing only one of
# the two makes the spoke re-enroll on every restart on half the fleet.
suite: spoke NetworkPolicy opens every Kubernetes API port
templates:
  - templates/networkpolicy.yaml
set:
  cluster:
    id: prod-us-east-1
    sdlc: prod
  hub:
    endpoints:
      - wss://hub.example.com/tunnel
    apiUrl: https://hub.example.com

tests:
  - it: allows both 443 and 6443 by default
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
              - port: 6443
                protocol: TCP

  - it: honours a trimmed list
    set:
      networkPolicy:
        egress:
          kubeAPI:
            ports: [6443]
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 6443
                protocol: TCP

  - it: still honours the deprecated single-port key without duplicating it
    set:
      networkPolicy:
        egress:
          kubeAPI:
            ports: [443]
            port: 6443
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
              - port: 6443
                protocol: TCP

  - it: appends the deprecated single-port key when it is new
    set:
      networkPolicy:
        egress:
          kubeAPI:
            ports: [443, 6443]
            port: 8443
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
              - port: 6443
                protocol: TCP
              - port: 8443
                protocol: TCP

  - it: refuses an empty port list rather than rendering a rule that allows nothing
    set:
      networkPolicy:
        egress:
          kubeAPI:
            ports: []
    asserts:
      - failedTemplate:
          errorPattern: kubeAPI.ports is empty

  - it: renders no API server rule when kubeAPI is off
    set:
      networkPolicy:
        egress:
          kubeAPI:
            enabled: false
            ports: []
    asserts:
      - notContains:
          path: spec.egress
          content:
            ports:
              - port: 6443
                protocol: TCP
