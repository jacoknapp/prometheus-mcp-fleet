# Copyright The prometheus-mcp-fleet Authors.
# SPDX-License-Identifier: Apache-2.0
#
# Cut a release from a `vX.Y.Z` tag.
#
# Produces, in order:
#   1. binaries + archives + checksums + SBOMs + source archive + GitHub Release
#      (GoReleaser, `.goreleaser.yaml`)
#   2. multi-arch hub and spoke images on GHCR, gated by Trivy BEFORE they are
#      pushed, then SLSA-provenance-attested, SBOM-attested and cosign-signed
#   3. both Helm charts packaged and pushed as OCI artifacts, then cosign-signed
#
# What it deliberately does NOT do:
#   * It does not move the `stable` OCI tag. `stable` is what ~100 production
#     clusters follow, and it moves only through `promote.yml`, which is gated
#     on a protected GitHub Environment with human approval. That separation is
#     the fleet-wide kill switch: stop approving promotions and the fleet
#     freezes on the last vetted digest.
#   * It does not publish a `latest` tag, for the same reason: an unpinnable
#     moving tag is not a supported input to anything we ship.
#   * It does not commit anything back to `main`. No job here has write access
#     to the default branch.
#
# Reproducibility: SOURCE_DATE_EPOCH is the tagged commit's committer time and
# is threaded into the Docker build as both an env var (BuildKit rewrites layer
# timestamps from it) and a build-arg (the Dockerfile derives the ldflags build
# date from it). That is what makes weekly-rebuild.yml's "same source, fresh
# base image" claim verifiable rather than aspirational.
#
# Fork safety: `push: tags` never fires from a fork, so nothing privileged here
# is reachable from a pull request.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A release must never be cancelled by a superseding run: a half-published
# release leaves signed-but-unattested digests on GHCR, which is worse than a
# duplicate run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Image repositories are derived per-job as
  # `ghcr.io/${{ github.repository }}/<component>` so the matrix leg owns the
  # whole name; there is deliberately no half-name here to drift out of step.
  CHART_REGISTRY: ghcr.io/jacoknapp/charts
  GO_VERSION: "1.27.x"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v3.21.4"
  # QEMU emulator image, pinned by digest and pre-pulled with backoff before
  # setup-qemu-action runs. See the pre-pull step for why.
  # renovate: datasource=docker depName=tonistiigi/binfmt
  BINFMT_IMAGE: "mirror.gcr.io/tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6"

jobs:
  # ---------------------------------------------------------------------------
  # Resolve every version string once so the binaries, the images and the charts
  # cannot disagree about what release this is.
  # ---------------------------------------------------------------------------
  meta:
    name: resolve release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      # NOTE on `egress-policy: block`: the allow-lists in this file are the
      # union of what these jobs are known to need. If a tool changes its
      # download host, the job fails with a blocked-connection annotation naming
      # the host — flip that job to `audit` for one run, read the insights page,
      # and add the endpoint. Do not leave it on `audit`.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag, version, commit and SOURCE_DATE_EPOCH
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REF_NAME}"
          case "${tag}" in
            v[0-9]*) : ;;
            *) echo "::error::tag '${tag}' is not of the form vX.Y.Z"; exit 1 ;;
          esac

          # Charts use appVersion without the leading `v`; images use the same
          # string so every artifact of a release agrees on one literal.
          version="${tag#v}"
          commit="$(git rev-parse HEAD)"
          epoch="$(git log -1 --pretty=%ct "${tag}")"

          prerelease=false
          case "${version}" in
            *-*) prerelease=true ;;
          esac

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=${commit}"
            echo "source_date_epoch=${epoch}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Release ${tag}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| version | \`${version}\` |"
            echo "| commit | \`${commit}\` |"
            echo "| SOURCE_DATE_EPOCH | \`${epoch}\` |"
            echo "| pre-release | \`${prerelease}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Refuse to release a dirty or unreachable tag
        run: |
          set -euo pipefail
          # The tag must be an ancestor of, or equal to, a commit on main.
          if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            echo "::warning::tag is not an ancestor of origin/main; releasing from a side branch"
          fi

  # ---------------------------------------------------------------------------
  # Binaries, archives, checksums, SBOMs, source archive, GitHub Release.
  # ---------------------------------------------------------------------------
  binaries:
    name: binaries and GitHub Release
    needs: [meta]
    runs-on: ubuntu-24.04
    permissions:
      # GoReleaser creates the GitHub Release and uploads assets.
      contents: write
      # Keyless cosign signature over checksums.txt, and build provenance.
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            goreleaser.com:443
            *.githubusercontent.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full tag history for the changelog.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # `.goreleaser.yaml` has an `sboms:` block, which shells out to syft.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # `.goreleaser.yaml` has a `signs:` block, which shells out to cosign.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Belt and braces with .goreleaser.yaml's mod_timestamp.
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}

      # Attest the archives themselves, not just the checksum file, so a
      # consumer can verify a single downloaded tarball against SLSA provenance
      # without first trusting checksums.txt.
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

  # ---------------------------------------------------------------------------
  # Multi-arch images. One matrix leg per component, both off the single root
  # Dockerfile via --build-arg COMPONENT.
  # ---------------------------------------------------------------------------
  images:
    name: image ${{ matrix.component }}
    needs: [meta]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Push to GHCR with GITHUB_TOKEN. No PAT is used anywhere in this repo.
      packages: write
      # Keyless cosign + attestation signing.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        component: [hub, spoke]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.component }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            *.blob.core.windows.net:443
            deb.debian.org:80
            fulcio.sigstore.dev:443
            gcr.io:443
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            timestamp.sigstore.dev:443
            toolbox-data.anchore.io:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-qemu-action pulls tonistiigi/binfmt, which by default comes from
      # Docker Hub. That fetch failed the v0.1.0 release outright ("error
      # pulling image configuration: download failed after attempts=6 ...
      # connection refused") with nothing wrong in the tree, so nothing in this
      # pipeline pulls from Docker Hub any more: the emulator and the Go
      # toolchain both come from mirror.gcr.io, and docker.io is no longer on
      # the egress allowlist above. The mirror serves the identical digest, so
      # this is the same image by content address, not a substitute.
      #
      # It is still pinned by digest, for the reason the base images are: an
      # emulator that changes silently underneath a build advertised as
      # reproducible makes that claim untrue. The retry covers a registry blip.
      - name: Pre-pull binfmt (retry on registry flake)
        env:
          BINFMT: ${{ env.BINFMT_IMAGE }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if docker pull "${BINFMT}"; then
              exit 0
            fi
            echo "binfmt pull failed (attempt ${attempt}); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::could not pull ${BINFMT} after 5 attempts"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.BINFMT_IMAGE }}

      # Buildx boots a BuildKit container, which by default comes from Docker
      # Hub -- the same dependency the emulator had, and it failed the release
      # the same way. Pinned to the mirror by digest for the same reasons.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.28.0@sha256:37539dd4d60fc70968d164d3850d903a2c56f6402214a1953fbf9fcb81ada731

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest`, no `stable`. Only the immutable version tag plus the
      # conventional major.minor convenience tag.
      - name: Derive image tags and OCI labels
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.meta.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=prometheus-mcp-fleet-${{ matrix.component }}
            org.opencontainers.image.description=MCP ${{ matrix.component }} for fleet-wide Prometheus access
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
            org.opencontainers.image.base.name=gcr.io/distroless/static-debian12:nonroot
          annotations: |
            org.opencontainers.image.description=MCP ${{ matrix.component }} for fleet-wide Prometheus access

      # Gate BEFORE publishing. A single-arch amd64 image is built and loaded
      # locally, scanned, and only then is the multi-arch image pushed. The
      # second build reuses the BuildKit cache from the first, so this costs
      # cache lookups rather than a second compile. Scanning after the push
      # would mean the vulnerable digest is already public and already
      # pullable, which defeats the point of a gate.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          tags: ${{ env.IMAGE }}:scan
          build-args: |
            COMPONENT=${{ matrix.component }}
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ needs.meta.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ needs.meta.outputs.source_date_epoch }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,scope=release-${{ matrix.component }},mode=max
        env:
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}

      # Trivy runs from its own container rather than trivy-action.
      #
      # trivy-action installs the binary via setup-trivy, which downloads a
      # release tarball from the GitHub asset CDN, and that download failed
      # here with curl exit 7 (cannot connect) even with every host it resolves
      # to on the egress allowlist. Running the published image instead removes
      # the download entirely: the job already authenticates to GHCR to push,
      # so this is a registry it is known to reach, and the scanner is pinned by
      # digest like every other image in this pipeline rather than resolved
      # through a version lookup at build time.
      #
      # The database still comes from GHCR (TRIVY_*_DB_REPOSITORY below), which
      # is what the action was configured to use anyway.
      - name: Trivy gate (HIGH/CRITICAL with a fix available)
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          SCAN_REF: ${{ env.IMAGE }}:scan
          # Trivy pulls its database from GHCR; the token lifts the anonymous
          # pull rate limit. Referenced under `set -u`, so it must be defined.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2 \
            -e TRIVY_JAVA_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-java-db:1 \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            "${TRIVY_IMAGE}" image \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln,secret \
            --exit-code 1 \
            "${SCAN_REF}"

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          build-args: |
            COMPONENT=${{ matrix.component }}
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ needs.meta.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ needs.meta.outputs.source_date_epoch }}
          provenance: mode=max
          # `sbom: true` runs buildkit-syft-scanner, which BuildKit pulls from
          # Docker Hub by default. Same dependency as the emulator and BuildKit
          # itself, in the last place it was still implicit.
          sbom: generator=mirror.gcr.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,scope=release-${{ matrix.component }},mode=max
        env:
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SPDX SBOM for the published image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-${{ matrix.component }}.spdx.json
          push-to-registry: true

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record the published digest for the chart job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s' "${DIGEST}" > "digests/${COMPONENT}"
          {
            echo "### Image \`${IMAGE}\`"
            echo
            echo "\`\`\`"
            echo "${IMAGE}@${DIGEST}"
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.component }}
          path: digests/${{ matrix.component }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Charts. Packaged with the release's appVersion and with image.digest and
  # image.tag pinned to what the `images` job actually published, so a default
  # `helm install` of this chart version is digest-pinned out of the box.
  # ---------------------------------------------------------------------------
  charts:
    name: package and push charts
    needs: [meta, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      # Charts get SLSA provenance too, so `promote.yml` can verify an image
      # and a chart with exactly the same two commands.
      attestations: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            *.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            get.helm.sh:443
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          merge-multiple: false
          path: digests

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" \
            | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          # helm writes its own registry config, which cosign does not read:
          # the chart pushed fine and then signing failed with UNAUTHORIZED.
          # cosign uses the Docker keychain, so log in there too. The images
          # job never hit this because it uses docker/login-action.
          printf '%s' "${GHCR_TOKEN}" \
            | cosign login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      # A chart version may only be published once. If it already exists we
      # refuse rather than overwrite: 100 clusters resolving the same chart
      # version to two different renders is an unfalsifiable support ticket.
      - name: Refuse to overwrite an already-published chart version
        run: |
          set -euo pipefail
          fail=0
          for chart in charts/*/; do
            name="$(helm show chart "${chart}" | awk '$1=="name:"{print $2}')"
            ver="$(helm show chart "${chart}" | awk '$1=="version:"{print $2}')"
            if helm show chart "oci://${CHART_REGISTRY}/${name}" --version "${ver}" >/dev/null 2>&1; then
              echo "::error file=${chart}Chart.yaml::${name} ${ver} is already published. Chart versions are independent SemVer and immutable: bump Chart.yaml's 'version' and re-tag."
              fail=1
            fi
          done
          exit "${fail}"

      - name: Pin image digests into chart defaults
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          command -v yq >/dev/null 2>&1 || {
            echo "::error::yq is not on PATH on this runner image"; exit 1;
          }

          pin() {
            local chart="$1" component="$2"
            local digest_file="digests/image-digest-${component}/${component}"
            if [ ! -s "${digest_file}" ]; then
              echo "::error::missing digest artifact for ${component}"
              exit 1
            fi
            local digest
            digest="$(cat "${digest_file}")"
            case "${digest}" in
              sha256:*) : ;;
              *) echo "::error::'${digest}' is not a sha256 digest"; exit 1 ;;
            esac

            yq -i ".image.tag = \"${VERSION}\"" "${chart}/values.yaml"
            yq -i ".image.digest = \"${digest}\"" "${chart}/values.yaml"
            echo "pinned ${chart}: tag=${VERSION} digest=${digest}"
          }

          pin charts/prometheus-mcp-hub   hub
          pin charts/prometheus-mcp-spoke spoke

      - name: Package, push and sign both charts
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-charts

          {
            echo "## Charts"
            echo
            echo "| chart | version | appVersion | digest |"
            echo "| --- | --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for chart in charts/prometheus-mcp-hub charts/prometheus-mcp-spoke; do
            name="$(basename "${chart}")"
            ver="$(helm show chart "${chart}" | awk '$1=="version:"{print $2}')"

            # --app-version writes appVersion without the leading `v`, which is
            # the documented contract between the git tag and the chart.
            helm package "${chart}" --app-version "${VERSION}" --destination dist-charts

            push_out="$(helm push "dist-charts/${name}-${ver}.tgz" "oci://${CHART_REGISTRY}" 2>&1)"
            echo "${push_out}"
            digest="$(printf '%s\n' "${push_out}" | awk '/^Digest:/{print $2}')"
            if [ -z "${digest}" ]; then
              echo "::error::could not parse a digest out of 'helm push' for ${name}"
              exit 1
            fi

            cosign sign --yes "${CHART_REGISTRY}/${name}@${digest}"
            printf '%s %s\n' "${CHART_REGISTRY}/${name}" "${digest}" >> chart-digests.txt

            echo "| \`${name}\` | \`${ver}\` | \`${VERSION}\` | \`${digest}\` |" >> "${GITHUB_STEP_SUMMARY}"
          done

      # One attestation per chart. `actions/attest-build-provenance` has no
      # matrix here, so the two subjects are declared explicitly rather than
      # looped: the action is a composite and cannot be called from a shell.
      - name: Read the hub chart digest
        id: hub_chart
        run: |
          set -euo pipefail
          digest="$(awk '$1 ~ /prometheus-mcp-hub$/ {print $2}' chart-digests.txt)"
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest the hub chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REGISTRY }}/prometheus-mcp-hub
          subject-digest: ${{ steps.hub_chart.outputs.digest }}
          push-to-registry: true

      - name: Read the spoke chart digest
        id: spoke_chart
        run: |
          set -euo pipefail
          digest="$(awk '$1 ~ /prometheus-mcp-spoke$/ {print $2}' chart-digests.txt)"
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest the spoke chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REGISTRY }}/prometheus-mcp-spoke
          subject-digest: ${{ steps.spoke_chart.outputs.digest }}
          push-to-registry: true

      # A workflow artifact, not a Release asset. Attaching to the Release would
      # need `contents: write` in this job, and the charts are already published
      # to the OCI registry — which is the supported way to consume them. The
      # .tgz files are kept only so a failed push can be diagnosed against the
      # exact bytes that were packaged.
      - name: Upload the packaged charts as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-charts
          path: dist-charts/*.tgz
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Explicitly assert what this workflow did not do.
  # ---------------------------------------------------------------------------
  stable-not-moved:
    name: stable tag untouched
    needs: [meta, binaries, images, charts]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Fail if any release job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "upstream results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a release job reported '${r}'"
              exit 1
            fi
          done

      - name: Record that stable was not promoted
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          {
            echo "## \`stable\` was NOT moved"
            echo
            echo "\`${VERSION}\` is published but not promoted. ~100 production"
            echo "clusters follow the \`stable\` tag and it moves only through the"
            echo "\`promote\` workflow, which requires approval on the \`production\`"
            echo "GitHub Environment."
            echo
            echo "To promote, run **Actions -> promote** with the digests printed above."
          } >> "${GITHUB_STEP_SUMMARY}"
