#
# OpenSSF Scorecard.
#
# Scorecard grades this repository's own supply-chain posture: are actions
# pinned, are permissions minimal, is there a security policy, is dependency
# update automation present, is there branch protection. Publishing the result
# is the point — the 100 platform teams asked to install the spoke into their
# production clusters can read the score without taking our word for it.
#
# Deliberately NOT run on `pull_request`: Scorecard needs repository-level
# metadata and `id-token: write`, neither of which a fork PR may have. Running
# it on `push: main` and weekly is the supported configuration.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    # Wednesday 05:23 UTC.
    - cron: "23 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Upload the SARIF result to the security tab.
      security-events: write
      # Publish the result to the OpenSSF API so the badge resolves.
      id-token: write
      # Scorecard's Branch-Protection and CI-Tests checks read workflow runs.
      actions: read
      # Scorecard's Webhooks / Maintained checks read issue and check metadata.
      checks: read
      issues: read
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF results API. This repository is
          # public and its posture is meant to be independently checkable.
          publish_results: true

      - name: Upload the SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Upload to the code scanning dashboard
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
