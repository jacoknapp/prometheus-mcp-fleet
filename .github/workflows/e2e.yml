#
# End-to-end: a real kind cluster, a real Prometheus, both real images, both
# real charts, and a real MCP tool call through the hub.
#
# This job deliberately owns almost nothing. `make e2e` creates the cluster,
# builds and side-loads the images, installs Prometheus and both charts, mints
# its own credentials through the hub's admin API and makes every assertion.
# The workflow installs tools and runs it.
#
# It used to own all of that in bash, in parallel with a Go suite that owned it
# too, and the two drifted: the workflow was passing `bootstrap.enrollmentToken`,
# `bootstrap.agentToken` and `hub.caCert` — three keys no chart here has ever
# had — while the Go suite shelled into the hub pod to run `mcp-call` and
# `admin` subcommands the binary has never had. Neither had ever executed. One
# path is the fix.
#
# Fork safety: this workflow is `pull_request` (not `pull_request_target`), the
# workflow-level permission is `contents: read`, and it needs no secrets at all
# — every credential is minted by the hub inside the ephemeral kind cluster.
name: e2e

on:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "api/**"
      - "test/e2e/**"
      - "charts/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/e2e.yml"
      - ".github/e2e/**"
  schedule:
    # Nightly, 03:17 UTC. Off the hour to avoid the top-of-hour runner crush.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.x"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v3.21.4"
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: "v0.33.0"
  # These four are duplicated as constants in test/e2e/e2e_test.go, which owns
  # them. They are here only so the diagnostics step can find the namespaces.
  HUB_NAMESPACE: "pmf-hub"
  SPOKE_NAMESPACE: "pmf-spoke"
  MONITORING_NAMESPACE: "monitoring"
  HUB_RELEASE: "prometheus-mcp-hub"
  SPOKE_RELEASE: "prometheus-mcp-spoke"

jobs:
  e2e:
    name: kind end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An e2e workflow that silently skips is worse than no e2e workflow,
      # because the green tick claims coverage that is absent.
      - name: Require the e2e suite and both charts to exist
        run: |
          set -euo pipefail
          missing=0
          for p in test/e2e charts/prometheus-mcp-hub charts/prometheus-mcp-spoke; do
            if [ ! -d "${p}" ]; then
              echo "::error::${p} does not exist; e2e cannot run and must not pretend it did"
              missing=1
            fi
          done
          if ! ls test/e2e/*_test.go >/dev/null 2>&1; then
            echo "::error::test/e2e contains no _test.go files"
            missing=1
          fi
          exit "${missing}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kind
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      # Fail in seconds on a values-schema mismatch rather than 40 minutes later
      # on a mysterious `helm upgrade` error, after a kind cluster and two image
      # builds have already been paid for. This is the exact install the suite
      # performs; the contract it asserts is written out in the headers of
      # .github/e2e/{hub,spoke}-values.yaml.
      #
      # This catches a nested typo only because values.schema.json sets
      # additionalProperties:false at every level the charts read field by
      # field. With it set only at the top — as it was — `hub.caCert` validated
      # cleanly and was then silently discarded, which is precisely how the
      # drift above survived being "preflighted".
      - name: Preflight the chart value contract
        run: |
          set -euo pipefail
          helm template preflight-hub charts/prometheus-mcp-hub \
            --values .github/e2e/hub-values.yaml \
            >/dev/null || {
              echo "::error file=.github/e2e/hub-values.yaml::the hub chart rejected the e2e values. Reconcile .github/e2e/hub-values.yaml with charts/prometheus-mcp-hub/values.schema.json."
              exit 1
            }
          helm template preflight-spoke charts/prometheus-mcp-spoke \
            --values .github/e2e/spoke-values.yaml \
            --set-string enrollment.existingSecret=pmf-enrollment \
            >/dev/null || {
              echo "::error file=.github/e2e/spoke-values.yaml::the spoke chart rejected the e2e values. Reconcile .github/e2e/spoke-values.yaml and the --set flags in test/e2e/e2e_test.go with charts/prometheus-mcp-spoke/values.schema.json."
              exit 1
            }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `make e2e` is `go test -tags e2e -timeout 40m ./test/e2e/...`. It builds
      # the images through `make images`, creates the kind cluster from
      # .github/e2e/kind.yaml, installs everything from .github/e2e/*-values.yaml
      # and reaches the hub over `kubectl port-forward`.
      - name: Run the e2e suite
        run: make e2e

      - name: Collect diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p e2e-debug
          kubectl cluster-info dump --all-namespaces --output-directory e2e-debug/cluster-dump
          kubectl get events --all-namespaces --sort-by=.lastTimestamp > e2e-debug/events.txt
          for ns in "${HUB_NAMESPACE}" "${SPOKE_NAMESPACE}" "${MONITORING_NAMESPACE}"; do
            kubectl -n "${ns}" get all -o wide            > "e2e-debug/${ns}-resources.txt" 2>&1
            kubectl -n "${ns}" describe pods              > "e2e-debug/${ns}-describe.txt"  2>&1
            for pod in $(kubectl -n "${ns}" get pods -o name); do
              safe="${pod#pod/}"
              kubectl -n "${ns}" logs "${pod}" --all-containers --tail=-1 \
                > "e2e-debug/${ns}-${safe}.log" 2>&1
              kubectl -n "${ns}" logs "${pod}" --all-containers --previous --tail=-1 \
                > "e2e-debug/${ns}-${safe}.previous.log" 2>&1
            done
          done
          helm -n "${HUB_NAMESPACE}"   get manifest "${HUB_RELEASE}"   > e2e-debug/hub-manifest.yaml   2>&1
          helm -n "${SPOKE_NAMESPACE}" get manifest "${SPOKE_RELEASE}" > e2e-debug/spoke-manifest.yaml 2>&1
          true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-debug
          if-no-files-found: warn
          retention-days: 14
