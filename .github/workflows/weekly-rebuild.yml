# SPDX-License-Identifier: Apache-2.0
#
# Weekly CVE rebuild.
#
# Takes the latest published release tag, rebuilds BOTH images from that exact,
# unchanged source onto freshly pulled base images, and publishes the result as
# `X.Y.Z-build.N`. The Go source does not change, the base layer does; that is
# the whole point. SOURCE_DATE_EPOCH is still the original tag's commit time, so
# the compiled binary inside the new image is byte-identical to the one in
# `X.Y.Z` and the only delta a consumer sees is the base layer. That is what
# makes "we only patched the OS" a checkable claim rather than a promise.
#
# It publishes. It does NOT promote: `stable` moves only through `promote.yml`,
# behind the protected `production` environment. A rebuild that quietly reached
# 100 clusters would be exactly the fleet-wide outage delivery mechanism this
# design exists to prevent.
#
# Vulnerability handling:
#   * A HIGH/CRITICAL finding that HAS an upstream fix means the rebuild did not
#     achieve its purpose -> the job fails, loudly, and nothing is promoted.
#   * A HIGH/CRITICAL finding with NO upstream fix cannot be rebuilt away ->
#     the image still publishes, and a tracking issue is opened or updated so
#     the exposure is visible instead of silently absorbed into a green tick.
name: weekly-rebuild

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild (vX.Y.Z). Empty means the latest published release."
        required: false
        type: string
        default: ""
      build_number:
        description: "Override the build number N in X.Y.Z-build.N. Empty means max(existing)+1."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: weekly-rebuild
  cancel-in-progress: false

env:
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
  # QEMU emulator image, pinned by digest and pre-pulled with backoff before
  # setup-qemu-action runs. See the pre-pull step for why.
  # renovate: datasource=docker depName=tonistiigi/binfmt
  BINFMT_IMAGE: "mirror.gcr.io/tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6"

jobs:
  # ---------------------------------------------------------------------------
  # Which tag, and which build number.
  # ---------------------------------------------------------------------------
  plan:
    name: resolve tag and build number
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Reading existing X.Y.Z-build.N tags off GHCR to pick the next N.
      packages: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      source_date_epoch: ${{ steps.plan.outputs.source_date_epoch }}
      build_tag: ${{ steps.plan.outputs.build_tag }}
    steps:
      # See the note in release.yml about tuning these allow-lists: a blocked
      # connection fails loudly and names the host. Never "fix" it by reverting
      # a publishing job to `audit`.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG}"
          if [ -z "${tag}" ]; then
            tag="$(gh release list --limit 50 --exclude-drafts --exclude-pre-releases \
              --json tagName,isLatest --jq '[.[] | select(.isLatest)][0].tagName' || true)"
          fi
          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "::error::no published release to rebuild. Cut a release first."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} does not exist in this repository"
            exit 1
          fi

          version="${tag#v}"
          commit="$(git rev-list -n 1 "${tag}")"
          epoch="$(git log -1 --pretty=%ct "${tag}")"

          # Next build number: max existing N for this version, plus one. If the
          # packages API is unavailable (first ever rebuild, or a permissions
          # change) fall back to 1 rather than guessing high.
          n="${INPUT_BUILD_NUMBER}"
          if [ -z "${n}" ]; then
            existing="$(gh api --paginate \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/prometheus-mcp-fleet%2Fhub/versions" \
              --jq '.[].metadata.container.tags[]' 2>/dev/null || true)"
            n="$(printf '%s\n' "${existing}" \
              | sed -n "s/^${version}-build\.\([0-9][0-9]*\)$/\1/p" \
              | sort -n | tail -1)"
            if [ -z "${n}" ]; then n=0; fi
            n=$(( n + 1 ))
          fi
          case "${n}" in
            [0-9]*) : ;;
            *) echo "::error::build number '${n}' is not numeric"; exit 1 ;;
          esac

          build_tag="${version}-build.${n}"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=${commit}"
            echo "source_date_epoch=${epoch}"
            echo "build_tag=${build_tag}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Weekly rebuild"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| source tag | \`${tag}\` |"
            echo "| source commit | \`${commit}\` |"
            echo "| SOURCE_DATE_EPOCH | \`${epoch}\` (unchanged from the original release) |"
            echo "| publishing as | \`${build_tag}\` |"
            echo
            echo "\`stable\` is **not** moved by this workflow."
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Rebuild, scan, publish, attest, sign.
  # ---------------------------------------------------------------------------
  rebuild:
    name: rebuild ${{ matrix.component }}
    needs: [plan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        component: [hub, spoke]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.component }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            *.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            gcr.io:443
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            toolbox-data.anchore.io:443
            tuf-repo-cdn.sigstore.dev:443

      # Check out the RELEASE TAG, not main. Rebuilding main would be building
      # different software and calling it a patch of the old one.
      - name: Checkout the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false

      # setup-qemu-action pulls tonistiigi/binfmt, which by default comes from
      # Docker Hub. That fetch failed the v0.1.0 release outright ("error
      # pulling image configuration: download failed after attempts=6 ...
      # connection refused") with nothing wrong in the tree, so nothing in this
      # pipeline pulls from Docker Hub any more: the emulator and the Go
      # toolchain both come from mirror.gcr.io, and docker.io is no longer on
      # the egress allowlist above. The mirror serves the identical digest, so
      # this is the same image by content address, not a substitute.
      #
      # It is still pinned by digest, for the reason the base images are: an
      # emulator that changes silently underneath a build advertised as
      # reproducible makes that claim untrue. The retry covers a registry blip.
      - name: Pre-pull binfmt (retry on registry flake)
        env:
          BINFMT: ${{ env.BINFMT_IMAGE }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if docker pull "${BINFMT}"; then
              exit 0
            fi
            echo "binfmt pull failed (attempt ${attempt}); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::could not pull ${BINFMT} after 5 attempts"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.BINFMT_IMAGE }}

      # Buildx boots a BuildKit container, which by default comes from Docker
      # Hub -- the same dependency the emulator had, and it failed the release
      # the same way. Pinned to the mirror by digest for the same reasons.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.28.0@sha256:37539dd4d60fc70968d164d3850d903a2c56f6402214a1953fbf9fcb81ada731

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `--pull` plus no cache is the entire point: the base image must be
      # re-resolved and re-fetched, otherwise this is a very slow no-op.
      - name: Rebuild amd64 image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE }}:rebuild-scan
          build-args: |
            COMPONENT=${{ matrix.component }}
            VERSION=${{ needs.plan.outputs.version }}
            COMMIT=${{ needs.plan.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ needs.plan.outputs.source_date_epoch }}
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}

      # Full report, unfixable included, for the tracking issue.
      - name: Trivy report (everything)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:rebuild-scan
          format: json
          output: trivy-${{ matrix.component }}.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          scanners: vuln
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1

      - name: Grype report (second opinion)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:rebuild-scan
          output-format: json
          output-file: grype-${{ matrix.component }}.json
          severity-cutoff: high
          # Reporting, not gating. The Trivy fixable check below is the gate;
          # two scanners both gating means one vendor's bad day blocks releases.
          fail-build: false

      - name: Gate on fixable HIGH/CRITICAL and classify the rest
        id: triage
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          report="trivy-${COMPONENT}.json"
          test -s "${report}"

          fixable="$(jq -r '
            [ .Results[]?.Vulnerabilities[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")
              | select((.FixedVersion // "") != "")
              | "\(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)" ]
            | unique | .[]' "${report}")"

          unfixable="$(jq -r '
            [ .Results[]?.Vulnerabilities[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")
              | select((.FixedVersion // "") == "")
              | "\(.VulnerabilityID)\t\(.Severity)\t\(.PkgName)\t\(.InstalledVersion)" ]
            | unique | .[]' "${report}")"

          printf '%s\n' "${unfixable}" | sed '/^$/d' > "unfixable-${COMPONENT}.tsv"

          {
            echo "### ${COMPONENT}"
            echo
            if [ -n "${unfixable}" ]; then
              echo "Unfixable HIGH/CRITICAL (cannot be rebuilt away):"
              echo
              echo '```'
              printf '%s\n' "${unfixable}"
              echo '```'
            else
              echo "No unfixable HIGH/CRITICAL findings."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ -n "${fixable}" ]; then
            echo "::error::${COMPONENT}: a fresh base image still carries fixable HIGH/CRITICAL vulnerabilities. The rebuild did not achieve its purpose; bump the base image digest in the Dockerfile."
            printf '%s\n' "${fixable}"
            exit 1
          fi

      - name: Rebuild and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE }}:${{ needs.plan.outputs.build_tag }}
          labels: |
            org.opencontainers.image.title=prometheus-mcp-fleet-${{ matrix.component }}
            org.opencontainers.image.description=MCP ${{ matrix.component }} for fleet-wide Prometheus access
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.plan.outputs.build_tag }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=gcr.io/distroless/static-debian12:nonroot
          build-args: |
            COMPONENT=${{ matrix.component }}
            VERSION=${{ needs.plan.outputs.version }}
            COMMIT=${{ needs.plan.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ needs.plan.outputs.source_date_epoch }}
          provenance: mode=max
          sbom: true
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}

      - name: Re-attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SPDX SBOM for the rebuilt image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Re-attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-${{ matrix.component }}.spdx.json
          push-to-registry: true

      - name: Re-sign the rebuilt image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_TAG: ${{ needs.plan.outputs.build_tag }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          {
            echo "Published \`${IMAGE}:${BUILD_TAG}\`"
            echo
            echo "\`\`\`"
            echo "${IMAGE}@${DIGEST}"
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-reports-${{ matrix.component }}
          path: |
            trivy-${{ matrix.component }}.json
            grype-${{ matrix.component }}.json
            unfixable-${{ matrix.component }}.tsv
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Track unfixable CVEs in a single, continuously updated issue.
  # ---------------------------------------------------------------------------
  cve-issue:
    name: track unfixable CVEs
    needs: [plan, rebuild]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.blob.core.windows.net:443
            github.com:443
            *.githubusercontent.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Download scan reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scan-reports-*
          path: reports
        continue-on-error: true

      - name: Build the report body
        id: body
        env:
          BUILD_TAG: ${{ needs.plan.outputs.build_tag }}
          SOURCE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          findings=""
          for component in hub spoke; do
            f="reports/scan-reports-${component}/unfixable-${component}.tsv"
            if [ -s "${f}" ]; then
              findings="${findings}### ${component}"$'\n\n'
              findings="${findings}| CVE | severity | package | installed |"$'\n'
              findings="${findings}| --- | --- | --- | --- |"$'\n'
              while IFS=$'\t' read -r cve sev pkg ver; do
                [ -n "${cve}" ] || continue
                findings="${findings}| ${cve} | ${sev} | \`${pkg}\` | \`${ver}\` |"$'\n'
              done < "${f}"
              findings="${findings}"$'\n'
            fi
          done

          if [ -z "${findings}" ]; then
            echo "has_findings=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "has_findings=true" >> "${GITHUB_OUTPUT}"
          {
            echo "body<<PMF_EOF"
            echo "The weekly rebuild of \`${SOURCE_TAG}\` (published as \`${BUILD_TAG}\`)"
            echo "found HIGH/CRITICAL vulnerabilities with **no upstream fix available**."
            echo "Rebuilding cannot clear these; they need a base image change, a"
            echo "dependency swap, or an accepted-risk decision recorded here."
            echo
            echo "${findings}"
            echo "Reports: [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "<!-- pmf-unfixable-cve-tracker -->"
            echo "PMF_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Open or update the tracking issue
        if: steps.body.outputs.has_findings == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_BODY: ${{ steps.body.outputs.body }}
          BUILD_TAG: ${{ needs.plan.outputs.build_tag }}
        with:
          script: |
            const marker = '<!-- pmf-unfixable-cve-tracker -->';
            const title = `Unfixable HIGH/CRITICAL CVEs in the released images`;
            const body = process.env.ISSUE_BODY;

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,supply-chain',
              per_page: 100,
            });
            const match = existing.find((i) => (i.body || '').includes(marker));

            if (match) {
              if ((match.body || '').trim() === body.trim()) {
                core.info(`issue #${match.number} already reports exactly this set; not touching it`);
                return;
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `The unfixable CVE set changed as of \`${process.env.BUILD_TAG}\`. The issue body above has been updated.`,
              });
              core.info(`updated issue #${match.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'supply-chain'],
            });
            core.info(`opened issue #${created.data.number}`);

      - name: Fail if a rebuild leg failed
        if: needs.rebuild.result != 'success'
        run: |
          echo "::error::the rebuild job reported '${{ needs.rebuild.result }}'"
          exit 1
