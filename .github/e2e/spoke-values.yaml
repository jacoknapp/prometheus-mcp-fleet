# ---------------------------------------------------------------------------
# CHART VALUE CONTRACT (charts/prometheus-mcp-spoke)
# ---------------------------------------------------------------------------
# Kept deliberately small. Every key here is a coupling between this workflow
# and the chart's values.schema.json, and `.github/workflows/e2e.yml`
# preflights the whole file with `helm template` before it builds anything, so
# drift fails in seconds with a named cause. Anything the chart already
# defaults correctly is NOT restated here.
#
# Set on the command line by .github/workflows/e2e.yml (never committed):
#   enrollment.token   a pmf_enr_... token minted through the hub's admin API
# ---------------------------------------------------------------------------
image:
  # `make images REGISTRY=localhost/prometheus-mcp-fleet` produces this name.
  registry: localhost
  repository: prometheus-mcp-fleet/spoke
  tag: e2e
  digest: ""
  # Never: kind's side-loaded copy is authoritative, and a typo in the image
  # name then fails immediately instead of hanging on ImagePullBackOff.
  pullPolicy: Never

cluster:
  id: e2e-kind
  displayName: "kind e2e cluster"
  labels:
    env: ci

hub:
  # Cross-namespace: the hub runs in pmf-hub, the spoke in pmf-spoke, which is
  # the same shape as the real deployment (different clusters entirely).
  #
  # A URL, not host:port, and it points at the hub's ORDINARY MCP Service port:
  # since ADR-0014 the tunnel is a WebSocket on that listener at the hub's
  # tunnel.path, and there is no 8443 listener left to dial. ws:// rather than
  # wss:// because there is no Ingress in this cluster to terminate TLS, so the
  # MCP listener is plaintext -- and enrollment, on the same listener, is http://.
  endpoints:
    - "ws://prometheus-mcp-hub.pmf-hub.svc.cluster.local:8080/tunnel"
  apiUrl: "http://prometheus-mcp-hub.pmf-hub.svc.cluster.local:8080"

prometheus:
  # Created by the Prometheus operator from .github/e2e/prometheus-values.yaml.
  url: "http://prometheus-operated.monitoring.svc:9090"
  timeout: 25s

# kind's default CNI does not enforce NetworkPolicy, so an enabled policy would
# be silently inert and give false confidence. Rendering is covered by
# helm-unittest and kubeconform instead.
networkPolicy:
  enabled: false

metrics:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
config:
  logLevel: debug
  logFormat: json

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi
